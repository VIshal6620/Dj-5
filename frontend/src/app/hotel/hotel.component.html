<app-navbar></app-navbar>

<div align="center" style="
     background-image: url('assets/789.jpg');
     background-size: cover;
     background-position: center;
     min-height: 90vh;
     padding-top: 90px;
     ">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: rgb(0, 41, 164); font-weight: bold;">
        Add HotelBooking        
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: rgb(17, 14, 224); font-weight: bold;">
        Update HotelBooking        
    </h1>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 15px;">
        <h5 style="color: rgb(5, 240, 68);" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="color: rgb(236, 10, 10);" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <!-- ✅ CARD STYLE -->
    <div style="
        background: rgba(255,255,255,0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        display: inline-block;
    ">

        <table>

            <tr>
                <th align="left">GuestName<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="guestName" [(ngModel)]="form.data.guestName"
                        placeholder="Enter guestName">
                </td>
                <td style="color: red;">{{form.inputerror.guestName}}</td>
            </tr>

            <tr>
                <th align="left">RoomType<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="roomType" [(ngModel)]="form.data.roomType"
                        placeholder="Enter roomType">
                </td>
                <td style="color: red;">{{form.inputerror.roomType}}</td>
            </tr>

            <tr>
                <th align="left">CheckInDate<span style="color: red">*</span></th>
                <td>
                    <input type="date" class="form-control" name="checkInDate" [(ngModel)]="form.data.checkInDate"
                        [ngModel]="form.data.checkInDate" placeholder="Enter checkInDate">
                </td>
                <td style="color: red;">{{form.inputerror.checkInDate}}</td>
            </tr>

            <tr>
                <th align="left">TotalBill<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="totalBill" [(ngModel)]="form.data.totalBill"
                        placeholder="Enter totalBill">
                </td>
                <td style="color: red;">{{form.inputerror.totalBill}}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2" style="padding-top: 15px;">
                    <button class="btn btn-primary" (click)="submit()">
                        Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
