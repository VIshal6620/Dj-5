<app-navbar></app-navbar>

<div align="center" style="
     background-image: url('assets/789.jpg');
     background-size: cover;
     background-position: center;
     min-height: 90vh;
     padding-top: 90px;
     ">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: rgb(0, 41, 164); font-weight: bold;">
        Add Repository
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: rgb(17, 14, 224); font-weight: bold;">
        Update Repository
    </h1>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 15px;">
        <h5 style="color: rgb(5, 240, 68);" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="color: rgb(236, 10, 10);" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <!-- ✅ CARD STYLE -->
    <div style="
        background: rgba(255,255,255,0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        display: inline-block;
    ">

        <table>

            <tr>
                <th align="left">RepoName<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="repoName" [(ngModel)]="form.data.repoName"
                        placeholder="Enter repoName">
                </td>
                <td style="color: red;">{{form.inputerror.repoName}}</td>
            </tr>

            <tr>
                <th align="left">Owner<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="owner" [(ngModel)]="form.data.owner"
                        placeholder="Enter owner">
                </td>
                <td style="color: red;">{{form.inputerror.owner}}</td>
            </tr>

            <tr>
                <th align="left">Branch<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="branch" [(ngModel)]="form.data.branch"
                        [ngModel]="form.data.branch" placeholder="Enter branch">
                </td>
                <td style="color: red;">{{form.inputerror.branch}}</td>
            </tr>

            <tr>
                <th align="left">Visibility<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="visibility" [(ngModel)]="form.data.visibility"
                        placeholder="Enter visibility">
                </td>
                <td style="color: red;">{{form.inputerror.visibility}}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2" style="padding-top: 15px;">
                    <button class="btn btn-primary" (click)="submit()">
                        Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
