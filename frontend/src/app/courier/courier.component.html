<app-navbar></app-navbar>

<div align="center" style="
     background-image: url('assets/789.jpg');
     background-size: cover;
     background-position: center;
     min-height: 90vh;
     padding-top: 90px;
     ">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: rgb(0, 41, 164); font-weight: bold;">
        Add Courier
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: rgb(17, 14, 224); font-weight: bold;">
        Update Courier
    </h1>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 15px;">
        <h5 style="color: rgb(240, 56, 5);" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="color: rgb(10, 236, 25);" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <!-- ✅ CARD STYLE -->
    <div style="
        background: rgba(255,255,255,0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        display: inline-block;
    ">

        <table>

            <tr>
                <th align="left">SenderName<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="senderName" [(ngModel)]="form.data.senderName"
                        placeholder="Enter senderName">
                </td>
                <td style="color: red;">{{form.inputerror.senderName}}</td>
            </tr>

            <tr>
                <th align="left">ReceiverName<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="receiverName" [(ngModel)]="form.data.receiverName"
                        placeholder="Enter receiverName">
                </td>
                <td style="color: red;">{{form.inputerror.receiverName}}</td>
            </tr>

            <tr>
                <th align="left">Status<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="status" [(ngModel)]="form.data.status"
                        [ngModel]="form.data.status" placeholder="Enter status">
                </td>
                <td style="color: red;">{{form.inputerror.status}}</td>
            </tr>

            <tr>
                <th align="left">DeliveryDate<span style="color: red">*</span></th>
                <td>
                    <input type="date" class="form-control" name="deliveryDate" [(ngModel)]="form.data.deliveryDate"
                        placeholder="Enter deliveryDate">
                </td>
                <td style="color: red;">{{form.inputerror.deliveryDate}}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2" style="padding-top: 15px;">
                    <button class="btn btn-primary" (click)="submit()">
                        Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
