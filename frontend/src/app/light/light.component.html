<app-navbar></app-navbar>

<div align="center" style="
     background-image: url('assets/2.jpg');
     background-size: cover;
     background-position: center;
     min-height: 90vh;
     padding-top: 90px;
     ">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: rgb(17, 14, 224); font-weight: bold;">
        Add Light
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: white; font-weight: bold;">
        Update Light
    </h1>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 15px;">
        <h5 style="color: rgb(5, 240, 13);" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="color: rgb(0, 243, 73);" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <!-- ✅ CARD STYLE -->
    <div style="
        background: rgba(255,255,255,0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        display: inline-block;
    ">

        <table>

            <tr>
                <th align="left">LightCode<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="lightCode" [(ngModel)]="form.data.lightCode"
                        placeholder="Enter lightCode">
                </td>
                <td style="color: red;">{{form.inputerror.lightCode}}</td>
            </tr>

            <tr>
                <th align="left">RoomName<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="roomName" [(ngModel)]="form.data.roomName"
                        placeholder="Enter roomName">
                </td>
                <td style="color: red;">{{form.inputerror.roomName}}</td>
            </tr>

            <tr>
                <th align="left">BrightnessLevel<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="partitions" [(ngModel)]="form.data.brightnessLevel"
                        [ngModel]="form.data.brightnessLevel" placeholder="Enter brightnessLevel">
                </td>
                <td style="color: red;">{{form.inputerror.brightnessLevel}}</td>
            </tr>

            <tr>
                <th align="left">Status<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="status" [(ngModel)]="form.data.status"
                        placeholder="Enter status">
                </td>
                <td style="color: red;">{{form.inputerror.status}}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2" style="padding-top: 15px;">
                    <button class="btn btn-primary" (click)="submit()">
                        Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
