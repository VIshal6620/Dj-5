<app-navbar></app-navbar>

<div align="center" style="
     background-image: url('assets/789.jpg');
     background-size: cover;
     background-position: center;
     min-height: 90vh;
     padding-top: 90px;
     ">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: rgb(0, 41, 164); font-weight: bold;">
        Add CarRental                  
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: rgb(17, 14, 224); font-weight: bold;">
        Update CarRental                  
    </h1>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 15px;">
        <h5 style="color: rgb(5, 240, 68);" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="color: rgb(236, 10, 10);" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <!-- ✅ CARD STYLE -->
    <div style="
        background: rgba(255,255,255,0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        display: inline-block;
    ">

        <table>

            <tr>
                <th align="left">CustomerName <span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="customerName " [(ngModel)]="form.data.customerName "
                        placeholder="Enter customerName ">
                </td>
                <td style="color: red;">{{form.inputerror.customerName }}</td>
            </tr>

            <tr>
                <th align="left">CarModel<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="carModel " [(ngModel)]="form.data.carModel "
                        placeholder="Enter carModel ">
                </td>
                <td style="color: red;">{{form.inputerror.carModel }}</td>
            </tr>

            <tr>
                <th align="left">RentPerDay <span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="rentPerDay" [(ngModel)]="form.data.rentPerDay "
                        [ngModel]="form.data.rentPerDay " placeholder="Enter rentPerDay ">
                </td>
                <td style="color: red;">{{form.inputerror.rentPerDay}}</td>
            </tr>

            <tr>
                <th align="left">FuelType<span style="color: red">*</span></th>
                <td>
                    <input type="text" class="form-control" name="fuelType " [(ngModel)]="form.data.fuelType "
                        placeholder="Enter fuelType ">
                </td>
                <td style="color: red;">{{form.inputerror.fuelType }}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2" style="padding-top: 15px;">
                    <button class="btn btn-primary" (click)="submit()">
                        Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
